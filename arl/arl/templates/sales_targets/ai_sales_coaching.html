{% extends "../base/base.html" %}
{% block title %}AI Sales Coaching{% endblock %}

{% block template %}
{% include "../base/navbar.html" %}

<div class="container py-4 mt-5" style="max-width: 900px;">

  <h2 class="mb-1">AI Sales Coaching</h2>

  <div class="text-muted mb-4">
    {{ period.name }} · {{ period.start_date }} to {{ period.end_date }}
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <pre style="white-space: pre-wrap; font-family: inherit;">{{ ai_coaching }}</pre>
    </div>
  </div>

  <a href="{% url 'sales_targets:sales_target_dashboard' period.id %}"
     class="btn btn-outline-secondary mt-3">
    Back to Dashboard
  </a>

</div>

{% endblock %}
